<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Städte-Karte Rheinland-Pfalz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f1; --ink:#1f2a24; --muted:#5b6a60;
  --land:#cfe3b4; --land-edge:#7f9a68; --de:#e6e8e1; --de-edge:#b9bfb2; --foreign:#dbe3e6;
  --water:#3b7fc4; --dot:#8b1e3f; --dot-ring:#fff; --ok:#2e7d32; --bad:#c62828;
  --panel:#ffffff; --line:#d5ddd2; --btn:#e7efe2; --btn-on:#1f2a24; --btn-on-ink:#fff; --rng:rgba(120,84,40,.16); --rng-edge:#9a7448; --rng-ink:#6d4f2c; --peak:#6d4f2c; --hl:#f08c00;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151a17; --ink:#e8efe9; --muted:#9fb0a5;
    --land:#3c5634; --land-edge:#7f9a68; --de:#262b27; --de-edge:#3c443d; --foreign:#1d2427;
    --water:#6aa8e8; --dot:#ff7aa2; --dot-ring:#151a17; --ok:#6fd47a; --bad:#ff6b6b;
    --panel:#1e2420; --line:#334038; --btn:#26302a; --btn-on:#e8efe9; --btn-on-ink:#151a17; --rng:rgba(214,170,110,.18); --rng-edge:#c9a06a; --rng-ink:#e3c08f; --peak:#e3c08f; --hl:#ffa94d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151a17; --ink:#e8efe9; --muted:#9fb0a5;
  --land:#3c5634; --land-edge:#7f9a68; --de:#262b27; --de-edge:#3c443d; --foreign:#1d2427;
  --water:#6aa8e8; --dot:#ff7aa2; --dot-ring:#151a17; --ok:#6fd47a; --bad:#ff6b6b;
  --panel:#1e2420; --line:#334038; --btn:#26302a; --btn-on:#e8efe9; --btn-on-ink:#151a17; --rng:rgba(214,170,110,.18); --rng-edge:#c9a06a; --rng-ink:#e3c08f; --peak:#e3c08f; --hl:#ffa94d;
  color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 14px 32px}
h1{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:clamp(1.5rem,4.5vw,2.1rem);line-height:1.15;margin:4px 0 4px}
.sub{color:var(--muted);margin:0 0 14px}
.modes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.modes button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:8px 16px;background:var(--btn);color:var(--ink);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--btn-on);color:var(--btn-on-ink)}
button:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.ask{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:10px;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.q{font-family:Fredoka,Nunito,sans-serif;font-weight:500;font-size:clamp(1.15rem,3.6vw,1.5rem)}
.q b{font-weight:600}
.score{color:var(--muted);font-weight:700;white-space:nowrap}
.fb{min-height:1.5em;font-weight:700;margin:2px 4px 8px}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.mapwrap{background:var(--foreign);border-radius:16px;overflow:hidden;border:1px solid var(--line);touch-action:manipulation}
svg{display:block;width:100%;height:auto;cursor:crosshair}
.st{fill:var(--de);stroke:var(--de-edge);stroke-width:1}
.rp{fill:var(--land);stroke:var(--land-edge);stroke-width:2}
.rv{fill:none;stroke:var(--water);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.rvl{fill:var(--water);font:italic 600 12px Nunito,sans-serif}
.nl{fill:var(--muted);font:600 12px Nunito,sans-serif;opacity:.85}
.dot{fill:var(--dot);stroke:var(--dot-ring);stroke-width:2;transition:r .15s}
.dot.ok{fill:var(--ok)} .dot.bad{fill:var(--bad)}
.dot.hl{r:9}
.lbl{font:700 13px Nunito,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.lbl.ok{fill:var(--ok)} .lbl.bad{fill:var(--bad)}
.ring{fill:none;stroke:var(--dot);stroke-width:3}
@media (prefers-reduced-motion:no-preference){.ring{animation:pulse 1.2s ease-out infinite}}
@keyframes pulse{from{r:8;opacity:1}to{r:24;opacity:0}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opts button,.act button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:12px 10px;cursor:pointer;text-align:center}
.opts button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opts button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.opts button:disabled{cursor:default}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.act button.main{background:var(--btn-on);color:var(--btn-on-ink);border-color:var(--btn-on)}
ul.rank{columns:2;column-gap:20px;padding-left:2em;margin:12px 0 0}
ul.rank li{break-inside:avoid;padding:2px 0}
ul.rank button{font:inherit;background:none;border:0;color:var(--ink);padding:2px 4px;border-radius:6px;cursor:pointer;text-align:left}
ul.rank button.on{background:var(--btn);font-weight:700}
.note{color:var(--muted);font-size:.85rem;margin-top:14px}

.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cats button{font:inherit;font-weight:600;font-size:.95rem;border:1px solid var(--line);border-radius:999px;padding:5px 13px;background:transparent;color:var(--ink);cursor:pointer}
.cats button[aria-pressed="true"]{background:var(--water);border-color:var(--water);color:#fff}
.rvq{fill:none;stroke:var(--water);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rvq.big{stroke-width:2.8}
.rvq.hl{stroke:var(--hl);stroke-width:5}
.rvq.ok{stroke:var(--ok);stroke-width:4.5} .rvq.bad{stroke:var(--bad);stroke-width:4.5}
.rng{fill:var(--rng);stroke:var(--rng-edge);stroke-width:1.5;stroke-dasharray:5 4;stroke-linejoin:round}
.rng.hl{fill:var(--hl);fill-opacity:.45;stroke:var(--hl)}
.rng.ok{fill:var(--ok);fill-opacity:.35;stroke:var(--ok)} .rng.bad{fill:var(--bad);fill-opacity:.35;stroke:var(--bad)}
.pk{fill:var(--peak);stroke:var(--dot-ring);stroke-width:1.5;stroke-linejoin:round}
.pk.ok{fill:var(--ok)} .pk.bad{fill:var(--bad)} .pk.hl{fill:var(--hl)}
.lbl.river{fill:var(--water);font-style:italic}
.lbl.range{font:600 16px Fredoka,Nunito,sans-serif;fill:var(--rng-ink);letter-spacing:.04em}
[hidden]{display:none!important}
@media (max-width:480px){ul.rank{columns:1}.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>Wo liegt was in Rheinland-Pfalz?</h1>
<p class="sub">Städte, Flüsse, Gebirge und Berge auf der Karte finden.</p>
<div class="modes" role="group" aria-label="Spielart">
  <button data-mode="learn" aria-pressed="true">Karte ansehen</button>
  <button data-mode="find" aria-pressed="false">Finde es</button>
  <button data-mode="name" aria-pressed="false">Was ist markiert?</button>
</div>
<div class="cats" role="group" aria-label="Thema">
  <button data-cat="city" aria-pressed="true">Städte</button>
  <button data-cat="river" aria-pressed="false">Flüsse</button>
  <button data-cat="range" aria-pressed="false">Gebirge</button>
  <button data-cat="peak" aria-pressed="false">Berge</button>
  <button data-cat="all" aria-pressed="false">Alles gemischt</button>
</div>
<div class="ask"><div class="q" id="q"></div><div class="score" id="score"></div></div>
<div class="fb" id="fb" aria-live="polite"></div>
<div class="mapwrap"><svg id="map" role="img" aria-label="Karte von Rheinland-Pfalz"></svg></div>
<div class="opts" id="opts" hidden></div>
<div class="act" id="act" hidden></div>
<ul class="rank" id="rank"></ul>
<p class="note">Gebirgsflächen sind vereinfacht eingezeichnet. Kartendaten: © OpenStreetMap-Mitwirkende, Natural Earth.</p>
</main>

const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const lineD=ls=>ls.map(l=>'M'+l.map(p=>p.join(',')).join('L')).join('');
const TYPE={city:'Stadt',river:'Fluss',range:'Gebirge',peak:'Berg'};
const ART={city:'die Stadt',river:'der Fluss',range:'das Gebirge',peak:'der Berg'};
for(const id in G.states) el('path',{d:G.states[id],class:'st'});
el('path',{d:G.states['DE-RP'],class:'rp'});
for(const l of G.labels){const t=el('text',{x:l.x,y:l.y,class:'nl','text-anchor':'middle'});t.textContent=l.t}
const gR=el('g',{}),gV=el('g',{}),gRing=el('g',{}),gP=el('g',{}),gL=el('g',{});
el('path',{d:lineD(G.main),class:'rvq'},gV);
const I=G.items.map((it,i)=>({...it,i}));
for(const it of I){
  if(it.t==='range') it.el=el('path',{d:'M'+it.poly.map(p=>p.join(',')).join('L')+'Z',class:'rng'},gR);
  if(it.t==='river') it.el=el('path',{d:lineD(it.lines),class:'rvq'+(it.name==='Rhein'||it.name==='Mosel'?' big':'')},gV);
  if(it.t==='city') it.el=el('circle',{cx:it.p[0],cy:it.p[1],r:6.5,class:'dot'},gP);

function setCls(it,c){it.el.setAttribute('class',it.base+(c?' '+c:''))}
function label(it,cls=''){
  let [x,y]=it.p,anchor='start',side=it.side||'c';
  if(it.t==='river'||it.t==='range') anchor='middle';
  else if(side==='r'){x+=10;y+=4}else if(side==='l'){x-=10;y+=4;anchor='end'}
  else if(side==='t'){y-=11;anchor='middle'}else{y+=21;anchor='middle'}

}
let cat='city', S={mode:'learn'};
const inCat=it=>cat==='all'||it.t===cat;
function visible(){ // which layers show

const pool=()=>I.filter(inCat);

  visible();reset();buildList();

function next(){

  if(S.idx>=S.queue.length) return finish();

  else{

  if(c===t){S.score++;S.found.add(t.i);fb(true,'Richtig! '+sentence(t));S.idx++;upd();setTimeout(next,1500)}
  else{setCls(c,'bad');label(c,'bad');S.wrong.push(t.i);
    fb(false,S.mode==='find'?`Das ist ${c.name}. ${t.name} ist grün markiert.`:`Leider nicht. Das ist ${t.name}.`);S.idx++;upd();
    const a=$('act');a.innerHTML='';a.hidden=false;const nb=document.createElement('button');nb.className='main';nb.textContent='Weiter';nb.onclick=next;a.appendChild(nb);nb.focus()}
}
function upd(){$('score').textContent=`Frage ${S.idx} von ${S.queue.length}, ${S.score} richtig`}
function finish(){
  $('opts').hidden=true;reset();pool().forEach(it=>label(it));
  const n=S.queue.length;$('q').innerHTML=S.score===n?`Alle ${n} richtig. Super!`:`${S.score} von ${n} richtig.`;$('score').textContent='';
  S.wrong.forEach(i=>setCls(I[i],'bad'));
  if(S.wrong.length)fb(false,'Rot markiert: das nochmal üben.');
  const a=$('act');a.innerHTML='';a.hidden=false;const w=S.wrong.slice();
  if(w.length){const b=document.createElement('button');b.className='main';b.textContent=`Fehler üben (${w.length})`;b.onclick=()=>start(shuffle(w));a.appendChild(b)}
  const r=document.createElement('button');r.textContent='Nochmal alle';r.onclick=()=>start(shuffle(pool().map(x=>x.i)));a.appendChild(r);
}
function showInfo(it){
  reset();pool().forEach(x=>label(x));setCls(it,'hl');
  $('q').innerHTML=sentence(it).replace(it.name,`<b>${it.name}</b>`);
  document.querySelectorAll('#rank button').forEach(b=>b.classList.toggle('on',b.textContent===it.name));
}
function segDist(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let u=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;u=Math.max(0,Math.min(1,u));return Math.hypot(p[0]-a[0]-u*dx,p[1]-a[1]-u*dy)}
function inPoly(p,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[a,b]=poly[i],[x,y]=poly[j];if((b>p[1])!==(y>p[1])&&p[0]<(x-a)*(p[1]-b)/(y-b)+a)c=!c}return c}
function dist(it,p){
  if(it.t==='river'){let d=1e9;for(const l of it.lines)for(let k=1;k<l.length;k++)d=Math.min(d,segDist(p,l[k-1],l[k]));return d}
  if(it.t==='range') return inPoly(p,it.poly)?0:1e9;
  return Math.hypot(it.p[0]-p[0],it.p[1]-p[1]);
}
const LIM={city:30,peak:30,river:22,range:1};
svg.addEventListener('click',e=>{
  const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse()),p=[q.x,q.y];
  let cands = S.mode==='find' ? I.filter(x=>x.t===S.t.t) : pool();
  if(S.mode==='name') return;
  let best=null,bd=1e9;
  // points and lines win over areas when close
  for(const it of cands){let d=dist(it,p);if(it.t==='range'&&d===0)d=25;if(d<bd&&d<(it.t==='range'?26:LIM[it.t])){bd=d;best=it}}
  if(!best)return;
  if(S.mode==='learn')return showInfo(best);
  if(S.locked)return;
  const tol={city:13,peak:13,river:9,range:0}[S.t.t];
  answer(dist(S.t,p)<=tol?S.t:best);
});
function buildList(){
  const ul=$('rank');ul.innerHTML='';
  [...pool()].sort((a,b)=>a.t===b.t?a.name.localeCompare(b.name,'de'):Object.keys(TYPE).indexOf(a.t)-Object.keys(TYPE).indexOf(b.t))
   .forEach(it=>{const li=document.createElement('li');const b=document.createElement('button');b.textContent=it.name;b.onclick=()=>showInfo(it);li.appendChild(b);ul.appendChild(li)});
}
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
document.querySelectorAll('.cats button').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;setMode(S.mode)});
setMode('learn');
</script>
